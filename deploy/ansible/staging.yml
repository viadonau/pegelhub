---
- name: Prepare PegelHub staging host
  hosts: staging
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert supported operating system family
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
          - ansible_facts["distribution"] in ["Debian", "Ubuntu"]
        fail_msg: "This bootstrap currently supports Debian and Ubuntu staging hosts."

    - name: Resolve Docker apt architecture
      ansible.builtin.set_fact:
        docker_apt_arch: "{{ docker_arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
      vars:
        docker_arch_map:
          aarch64: arm64
          armv7l: armhf
          x86_64: amd64

    - name: Validate required staging variables
      ansible.builtin.assert:
        that:
          - pegelhub_staging_deploy_user | length > 0
          - pegelhub_staging_deploy_group | length > 0
          - pegelhub_staging_repo_url | length > 0
          - pegelhub_staging_repo_dir | length > 0
          - pegelhub_staging_repo_version | length > 0
          - pegelhub_staging_config_dir == "/etc/pegelhub/staging"
          - pegelhub_staging_data_dir == "/var/lib/pegelhub/staging"
          - pegelhub_staging_ftp_connector_dir == "/etc/pegelhub/connectors/staging-ftp"

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ pegelhub_staging_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create deploy group
      ansible.builtin.group:
        name: "{{ pegelhub_staging_deploy_group }}"
        state: present

    - name: Create Docker group before assigning membership
      ansible.builtin.group:
        name: docker
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ pegelhub_staging_deploy_user }}"
        group: "{{ pegelhub_staging_deploy_group }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true
        state: present
      register: deploy_user_result

    - name: Create deploy user SSH directory
      ansible.builtin.file:
        path: "{{ deploy_user_result.home | default('/home/' ~ pegelhub_staging_deploy_user) }}/.ssh"
        state: directory
        owner: "{{ pegelhub_staging_deploy_user }}"
        group: "{{ pegelhub_staging_deploy_group }}"
        mode: "0700"
      when: pegelhub_staging_deploy_authorized_key | length > 0

    - name: Install deploy SSH public key
      ansible.builtin.lineinfile:
        path: "{{ deploy_user_result.home | default('/home/' ~ pegelhub_staging_deploy_user) }}/.ssh/authorized_keys"
        line: "{{ pegelhub_staging_deploy_authorized_key }}"
        create: true
        owner: "{{ pegelhub_staging_deploy_user }}"
        group: "{{ pegelhub_staging_deploy_group }}"
        mode: "0600"
      when: pegelhub_staging_deploy_authorized_key | length > 0

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker apt signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - "{{ docker_apt_arch }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Refresh apt cache after Docker repository change
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ pegelhub_staging_docker_packages }}"
        state: present
        update_cache: true

    - name: Ensure Docker socket is enabled and running
      ansible.builtin.service:
        name: docker.socket
        state: started
        enabled: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create repository directory
      ansible.builtin.file:
        path: "{{ pegelhub_staging_repo_dir }}"
        state: directory
        owner: "{{ pegelhub_staging_deploy_user }}"
        group: "{{ pegelhub_staging_deploy_group }}"
        mode: "0755"

    - name: Clone or update PegelHub repository
      ansible.builtin.git:
        repo: "{{ pegelhub_staging_repo_url }}"
        dest: "{{ pegelhub_staging_repo_dir }}"
        version: "{{ pegelhub_staging_repo_version }}"
        update: true
      become: true
      become_user: "{{ pegelhub_staging_deploy_user }}"

    - name: Create staging configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ pegelhub_staging_deploy_user }}"
        group: "{{ pegelhub_staging_deploy_group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ pegelhub_staging_config_dir }}"
          mode: "0750"
        - path: "{{ pegelhub_staging_config_dir }}/tls"
          mode: "0700"
        - path: "{{ pegelhub_staging_config_dir }}/tls/server"
          mode: "0700"
        - path: "{{ pegelhub_staging_config_dir }}/tls/trust"
          mode: "0755"
        - path: "{{ pegelhub_staging_data_dir }}"
          mode: "0750"
        - path: "{{ pegelhub_staging_data_dir }}/state"
          mode: "0750"
        - path: "{{ pegelhub_staging_ftp_connector_dir }}"
          mode: "0750"
        - path: "{{ pegelhub_staging_ftp_connector_dir }}/config"
          mode: "0700"
        - path: "{{ pegelhub_staging_ftp_connector_dir }}/trust"
          mode: "0755"

    - name: Create staging FTP connector env file from example when missing
      ansible.builtin.copy:
        src: "{{ pegelhub_staging_repo_dir }}/deploy/connector/connector.env.example"
        dest: "{{ pegelhub_staging_ftp_connector_dir }}/connector.env"
        remote_src: true
        force: false
        owner: "{{ pegelhub_staging_deploy_user }}"
        group: "{{ pegelhub_staging_deploy_group }}"
        mode: "0640"
      register: staging_connector_env

    - name: Name a new staging FTP connector project
      ansible.builtin.lineinfile:
        path: "{{ pegelhub_staging_ftp_connector_dir }}/connector.env"
        regexp: '^COMPOSE_PROJECT_NAME='
        line: 'COMPOSE_PROJECT_NAME=pegelhub-staging-ftp'
      when: staging_connector_env.changed

    - name: Create staging env file from example when missing
      ansible.builtin.copy:
        src: "{{ pegelhub_staging_repo_dir }}/deploy/single-host/pegelhub.env.example"
        dest: "{{ pegelhub_staging_config_dir }}/pegelhub.env"
        remote_src: true
        force: false
        owner: "{{ pegelhub_staging_deploy_user }}"
        group: "{{ pegelhub_staging_deploy_group }}"
        mode: "0600"
      register: staging_platform_env

    - name: Name a new staging platform project
      ansible.builtin.lineinfile:
        path: "{{ pegelhub_staging_config_dir }}/pegelhub.env"
        regexp: '^COMPOSE_PROJECT_NAME='
        line: 'COMPOSE_PROJECT_NAME=pegelhub-staging'
      when: staging_platform_env.changed

    - name: Sync missing staging env template keys
      ansible.builtin.command:
        cmd: "{{ pegelhub_staging_repo_dir }}/deploy/single-host/scripts/sync-env-template.sh"
        chdir: "{{ pegelhub_staging_repo_dir }}"
      environment:
        PEGELHUB_CONFIG_DIR: "{{ pegelhub_staging_config_dir }}"
      become: true
      become_user: "{{ pegelhub_staging_deploy_user }}"
      register: sync_env_template_result
      changed_when: "'added ' in sync_env_template_result.stdout or 'created ' in sync_env_template_result.stdout"

    - name: Initialize server-local staging secrets
      ansible.builtin.command:
        cmd: "{{ pegelhub_staging_repo_dir }}/deploy/single-host/scripts/init-env-secrets.sh"
        chdir: "{{ pegelhub_staging_repo_dir }}"
      environment:
        PEGELHUB_CONFIG_DIR: "{{ pegelhub_staging_config_dir }}"
      become: true
      become_user: "{{ pegelhub_staging_deploy_user }}"
      register: init_env_secrets_result
      changed_when: "'initialized ' in init_env_secrets_result.stdout"

    - name: Show next manual steps
      ansible.builtin.debug:
        msg:
          - "Staging host bootstrap complete."
          - "Review {{ pegelhub_staging_config_dir }}/pegelhub.env and fill hostnames and the Core image tag."
          - "Missing keys from .env.example are appended without overwriting existing values."
          - "Server-local database and Keycloak secrets are initialized automatically when placeholders are present."
          - "After manually enrolling the staging FTP client, create connector.yaml and mappings/*.yaml under {{ pegelhub_staging_ftp_connector_dir }}/config, and set its Core and Keycloak URLs to the published staging FQDNs."
          - "This playbook does not import or reset Keycloak; use the explicit bootstrap only for a stopped, new or deliberately emptied Keycloak database."
          - "Log in to GHCR on the staging host if packages are private."
          - "Run deploy/single-host/scripts/deploy.sh with PEGELHUB_CONFIG_DIR={{ pegelhub_staging_config_dir }} and PEGELHUB_STATE_DIR={{ pegelhub_staging_data_dir }}/state."
          - "The staging FTP connector is deployed separately with deploy/connector/compose.yaml and {{ pegelhub_staging_ftp_connector_dir }}/connector.env."
          - "Frontend releases use the same checkout and deploy user but are activated separately through deploy/single-host/scripts/deploy-frontend.sh."
