name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

x-pegelhub-logging: &pegelhub-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

volumes:
  caddy-config:
  caddy-data:
  metastore-data:
  datastore-data:
  keycloak-data:

networks:
  pegelhub-staging:
    driver: bridge

services:
  caddy:
    container_name: ${COMPOSE_PROJECT_NAME}-reverse-proxy
    image: caddy:2-alpine
    logging: *pegelhub-logging
    restart: unless-stopped
    environment:
      PEGELHUB_FRONTEND_HOSTNAME: ${PEGELHUB_FRONTEND_HOSTNAME}
      PEGELHUB_API_HOSTNAME: ${PEGELHUB_API_HOSTNAME}
      PEGELHUB_KEYCLOAK_HOSTNAME: ${PEGELHUB_KEYCLOAK_HOSTNAME}
      PEGELHUB_HTTPS_URL_SUFFIX: ${PEGELHUB_HTTPS_URL_SUFFIX:-}
      PEGELHUB_TLS_MODE: ${PEGELHUB_TLS_MODE:-automatic}
    ports:
      - "${PEGELHUB_HTTP_BIND:-80}:80"
      - "${PEGELHUB_HTTPS_BIND:-443}:${PEGELHUB_HTTPS_CONTAINER_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${PEGELHUB_TLS_SERVER_DIR:-./tls/server}
        target: /etc/caddy/certificates
        read_only: true
      - caddy-config:/config
      - caddy-data:/data
    depends_on:
      - keycloak
    networks:
      pegelhub-staging:
        aliases:
          - ${PEGELHUB_FRONTEND_HOSTNAME}
          - ${PEGELHUB_API_HOSTNAME}
          - ${PEGELHUB_KEYCLOAK_HOSTNAME}

  meta-db:
    container_name: ${COMPOSE_PROJECT_NAME}-meta-db
    image: postgres:14-alpine
    logging: *pegelhub-logging
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${META_PASSWORD}
      POSTGRES_DB: ${META_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${META_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - metastore-data:/var/lib/postgresql/data
    networks:
      - pegelhub-staging

  data-db:
    container_name: ${COMPOSE_PROJECT_NAME}-data-db
    image: influxdb:2.2-alpine
    logging: *pegelhub-logging
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_INTERNAL_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - datastore-data:/var/lib/influxdb2
    networks:
      - pegelhub-staging

  influx-bucket-setup:
    image: influxdb:2.2-alpine
    logging: *pegelhub-logging
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/configure-buckets.sh"]
    environment:
      INFLUX_HOST: http://data-db:8086
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_INTERNAL_BUCKET: ${INFLUX_INTERNAL_BUCKET}
      INFLUX_DATA_BUCKET: ${INFLUX_DATA_BUCKET}
      INFLUX_DATA_RETENTION: ${INFLUX_DATA_RETENTION:-60d}
      INFLUX_TELEMETRY_BUCKET: ${INFLUX_TELEMETRY_BUCKET}
      INFLUX_TELEMETRY_RETENTION: ${INFLUX_TELEMETRY_RETENTION:-60d}
    volumes:
      - ../../core/docker/influxdb/configure-buckets.sh:/usr/local/bin/configure-buckets.sh:ro
    depends_on:
      data-db:
        condition: service_healthy
    networks:
      - pegelhub-staging

  keycloak-db:
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak-db
    image: postgres:16-alpine
    logging: *pegelhub-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d ${KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks:
      - pegelhub-staging

  keycloak:
    container_name: ${COMPOSE_PROJECT_NAME}-keycloak
    image: quay.io/keycloak/keycloak:26.2
    logging: *pegelhub-logging
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://${PEGELHUB_KEYCLOAK_HOSTNAME}${PEGELHUB_HTTPS_URL_SUFFIX:-}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ../../core/docker/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.1 200\\|HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - pegelhub-staging

  core-app:
    container_name: ${COMPOSE_PROJECT_NAME}-core
    image: ghcr.io/viadonau/pegelhub-core:${PEGELHUB_IMAGE_TAG:?Set PEGELHUB_IMAGE_TAG}
    logging: *pegelhub-logging
    pull_policy: always
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${CORE_JAVA_TOOL_OPTIONS:-}
      PEGELHUB_TRUST_MODE: ${PEGELHUB_TRUST_MODE:-system}
      DB_URI: meta-db:5432/${META_DB}
      DB_USER: postgres
      DB_PASSWORD: ${META_PASSWORD}
      INFLUX_URL: http://data-db:8086/
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_DATA_BUCKET: ${INFLUX_DATA_BUCKET}
      INFLUX_TELEMETRY_BUCKET: ${INFLUX_TELEMETRY_BUCKET}
      INFLUX_LATEST_RANGE: ${INFLUX_LATEST_RANGE:-72h}
      KEYCLOAK_ISSUER_URI: https://${PEGELHUB_KEYCLOAK_HOSTNAME}${PEGELHUB_HTTPS_URL_SUFFIX:-}/realms/pegelhub
    depends_on:
      meta-db:
        condition: service_healthy
      data-db:
        condition: service_healthy
      influx-bucket-setup:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    volumes:
      - type: bind
        source: ${PEGELHUB_TRUST_DIR:-./tls/trust}
        target: /run/pegelhub/extra-ca
        read_only: true
    networks:
      - pegelhub-staging
