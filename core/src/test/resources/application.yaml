spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate

pegelhub:
  influx:
    url: http://localhost:8086/
    org: test
    token: test-token
    data-bucket: data
    telemetry-bucket: telemetry
    latest-range: 72h

logging:
  level:
    com.github.dockerjava: WARN
    org.testcontainers: INFO
