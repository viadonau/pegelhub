spring:
  messages:
    fallback-to-system-locale: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  datasource:
    url: jdbc:postgresql://${DB_URI}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  application:
    name: core-app

server:
  address: 0.0.0.0
  port: 8080

pegelhub:
  security:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
  influx:
    url: ${INFLUX_URL}
    org: ${INFLUX_ORG}
    token: ${INFLUX_TOKEN}
    data-bucket: ${INFLUX_DATA_BUCKET}
    telemetry-bucket: ${INFLUX_TELEMETRY_BUCKET}
    latest-range: ${INFLUX_LATEST_RANGE:72h}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  allowed-locales:
    - en
    - de
  api-docs:
    enabled: true
  paths-to-match: /api/v1/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    filter: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: Deutsch
        url: /v3/api-docs?lang=de
      - name: English
        url: /v3/api-docs?lang=en
    urls-primary-name: Deutsch
