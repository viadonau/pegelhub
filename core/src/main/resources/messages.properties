openapi.measurement.measurement-api.list-buckets.description=Returns average buckets for charting in a bounded time window.\nProvide either last or both from and to. Supply bucket for an explicit width, or maxPoints for automatic resolution.\nUSER actors need measurement:read or system:admin. CLIENT actors need measurement:read, an active registered connector, and explicit station or time-series read access.\n
openapi.measurement.measurement-api.list-raw.description=Returns unaggregated measurement points in a bounded time window.\nProvide either last or both from and to. Results are bounded by limit; truncated indicates whether more points exist in the window.\nFor the latest measurement, request a bounded descending list with limit=1, for example last=365d&order=desc&limit=1.\nUSER actors need measurement:read or system:admin. CLIENT actors need measurement:read, an active registered connector, and explicit station or time-series read access.\n
