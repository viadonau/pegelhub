openapi.measurement.measurement-api.write.description=Stores unaggregated measurements submitted by the authenticated connector.\nValues use the time series source representation; metres-above-adria water levels are converted to canonical centimetres using the measuring point gauge zero.\nThe connector identity comes from the access token. Requires a CLIENT actor with measurement:write, an active registration, exact source ownership, and an active metadata path.\n
