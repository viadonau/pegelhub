openapi.measurement.measurement-api.list-buckets.description=Gibt Mittelwerte je Zeitintervall für Diagramme in einem begrenzten Zeitfenster zurück.\nGeben Sie entweder `last` oder sowohl `from` als auch `to` an. `bucket` legt die Intervalllänge fest. Mit `maxPoints` wird die Intervalllänge automatisch bestimmt.\nErfordert `measurement:read` oder `system:admin`.\n
openapi.measurement.measurement-api.list-raw.description=Gibt Rohmesswerte in einem begrenzten Zeitfenster zurück.\nGeben Sie entweder `last` oder sowohl `from` als auch `to` an. `limit` begrenzt die Anzahl der zurückgegebenen Messwerte. `truncated` gibt an, ob das Zeitfenster weitere Messwerte enthält.\nDen neuesten Messwert im Zeitfenster erhalten Sie mit `order=desc` und `limit=1`, zum Beispiel `last=365d&order=desc&limit=1`.\nErfordert `measurement:read` oder `system:admin`.\n
