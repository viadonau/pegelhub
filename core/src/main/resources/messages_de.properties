openapi.measurement.measurement-api.list-buckets.description=Gibt Durchschnittsintervalle für Diagramme in einem begrenzten Zeitfenster zurück.\nGeben Sie entweder last oder sowohl from als auch to an. Verwenden Sie bucket für eine explizite Breite oder maxPoints für die automatische Auflösung.\nUSER-Akteure benötigen measurement:read oder system:admin. CLIENT-Akteure benötigen measurement:read, einen aktiven registrierten Konnektor und einen expliziten Lesezugriff auf die Pegelstation oder Messzeitreihe.\n
openapi.measurement.measurement-api.list-raw.description=Gibt nicht aggregierte Messwerte in einem begrenzten Zeitfenster zurück.\nGeben Sie entweder last oder sowohl from als auch to an. Die Ergebnisse werden durch limit begrenzt; truncated gibt an, ob weitere Messwerte im Zeitfenster vorhanden sind.\nFordern Sie den neuesten Messwert als begrenzte, absteigend sortierte Liste mit limit=1 an, zum Beispiel last=365d&order=desc&limit=1.\nUSER-Akteure benötigen measurement:read oder system:admin. CLIENT-Akteure benötigen measurement:read, einen aktiven registrierten Konnektor und einen expliziten Lesezugriff auf die Pegelstation oder Messzeitreihe.\n
