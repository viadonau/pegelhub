openapi.measurement.measurement-api.write.description=Speichert nicht aggregierte Messwerte des authentifizierten Konnektors.\nDie Werte verwenden die Quelldarstellung der Messzeitreihe; Wasserstände in metres-above-adria werden mit dem Pegelnullpunkt des Messpunkts in kanonische Zentimeter umgerechnet.\nDie Konnektoridentität stammt aus dem Zugriffstoken. Erfordert einen CLIENT-Akteur mit measurement:write, eine aktive Registrierung, exakte Quellenzuordnung und einen aktiven Metadatenpfad.\n
