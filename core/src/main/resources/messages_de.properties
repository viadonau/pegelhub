openapi.measurement.measurement-api.returns-the-influx-db-system-time-used=Gibt die aktuelle Systemzeit von InfluxDB zurück. Damit lassen sich die Erreichbarkeit und die Uhrzeit des Messwertspeichers prüfen. Eine Anmeldung ist nicht erforderlich.
