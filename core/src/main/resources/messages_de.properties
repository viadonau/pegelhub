openapi.measurement.measurement-api.list-buckets.description=Gibt zusammengefasste Messwerte für Diagramme in einem begrenzten Zeitfenster zurück.\nGeben Sie entweder `last` oder sowohl `from` als auch `to` an. Mit `bucket` wird ein festes Intervall, mit `maxPoints` eine automatische Auflösung gewählt.\nErfordert `measurement:read` oder `system:admin`.\n
