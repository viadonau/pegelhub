info:
  name: Create Station
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/{{apiPath}}/stations"
  headers:
    - name: X-Auth-Profile
      value: operator
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "ownerId": "{{stationOwnerId}}",
        "stationNumber": "bruno-{{workflowRunId}}",
        "name": "Bruno Workflow Station",
        "waterBody": "Danube",
        "location": "Vienna"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('status is 201', () => expect(res.getStatus()).to.equal(201));
        bru.setVar('stationId', res.getBody().id);

docs: Creates a station and captures its id.
