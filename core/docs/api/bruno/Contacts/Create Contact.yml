info:
  name: Create Contact
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/{{apiPath}}/contact"
  headers:
    - name: X-Auth-Profile
      value: operator
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "organization": "Hydro Systems GmbH",
        "contactPerson": "Alex Meyer",
        "contactStreet": "River Street 1",
        "contactPlz": "1020",
        "location": "Vienna",
        "contactCountry": "AT",
        "emergencyNumber": "+43 1 5550100",
        "emergencyMail": "emergency@example.com",
        "serviceNumber": "+43 1 5550200",
        "serviceMail": "service@example.com",
        "administrationPhoneNumber": "+43 1 5550300",
        "administrationMail": "admin@example.com",
        "contactNodes": "Legacy contact example."
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('status is 200', () => expect(res.getStatus()).to.equal(200));
        bru.setVar('contactId', res.getBody().id);

docs: Creates a legacy contact and captures its id.
