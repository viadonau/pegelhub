info:
  name: Get Contact
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/{{apiPath}}/contact/{{uuid}}"
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('uuid', bru.getVar('contactId'));
    - type: after-response
      code: test('status is 200', () => expect(res.getStatus()).to.equal(200));

docs: Gets a legacy contact by id.
