info:
  name: Get Station Owner
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/{{apiPath}}/station-owners/{{id}}"
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('id', bru.getVar('stationOwnerId'));
    - type: after-response
      code: test('status is 200', () => expect(res.getStatus()).to.equal(200));

docs: Gets a station owner by id.
