info:
  name: Read Measurement Intervals
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/{{apiPath}}/time-series/{{timeSeriesId}}/measurements/intervals?from=2026-06-17T00:00:00Z&to=2026-06-18T00:00:00Z&interval=15m&timeBasis=UTC&closedOnly=true"
  params:
    - name: from
      value: 2026-06-17T00:00:00Z
      type: query
    - name: to
      value: 2026-06-18T00:00:00Z
      type: query
    - name: interval
      value: 15m
      type: query
    - name: timeBasis
      value: UTC
      type: query
    - name: closedOnly
      value: "true"
      type: query
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

docs: Set aligned from/to boundaries for the selected interval and time basis.
