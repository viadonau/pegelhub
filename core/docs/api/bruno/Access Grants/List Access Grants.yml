info:
  name: List Access Grants
  type: http
  seq: 2
  tags:
    - read-only

http:
  method: GET
  url: "{{baseUrl}}/{{apiPath}}/access-grants"
  params:
    - name: connectorId
      value: "{{connectorId}}"
      type: query
      disabled: true
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('status is 200', () => expect(res.getStatus()).to.equal(200));

docs: Lists access grants. Enable connectorId to filter by the selected connector.
