info:
  name: Grant Station Read Access
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/{{apiPath}}/connectors/{{connectorId}}/read-access/stations/{{stationId}}"
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('status is 204', () => expect(res.getStatus()).to.equal(204));

docs: Grants a connector read access to a station and its time series.
