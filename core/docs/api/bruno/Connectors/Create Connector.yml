info:
  name: Create Connector
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/{{apiPath}}/connectors"
  headers:
    - name: X-Auth-Profile
      value: operator
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Manual Bruno example",
        "type": "other"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();
        test('status is 201', () => expect(status).to.equal(201));
        if (status === 201) bru.setVar('connectorId', res.getBody().id);

docs: Creates standalone connector metadata without an identity binding and captures its id.
