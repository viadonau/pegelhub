info:
  name: Revoke Time Series Read Access
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/{{apiPath}}/connectors/{{connectorId}}/read-access/time-series/{{timeSeriesId}}"
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('status is 204', () => expect(res.getStatus()).to.equal(204));

docs: Revokes a connector time-series read access relation.
