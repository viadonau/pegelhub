info:
  name: Get Latest Telemetry
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/{{apiPath}}/telemetry/last/{{uuid}}"
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('uuid', bru.getVar('connectorId'));
    - type: after-response
      code: test('status is 200', () => expect(res.getStatus()).to.equal(200));

docs: Gets the latest telemetry entry for the configured id.
