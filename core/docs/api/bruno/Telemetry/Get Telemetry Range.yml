info:
  name: Get Telemetry Range
  type: http
  seq: 2
  tags:
    - read-only

http:
  method: GET
  url: "{{baseUrl}}/{{apiPath}}/telemetry/{{range}}"
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('status is 200', () => expect(res.getStatus()).to.equal(200));

docs: Lists telemetry in a positive relative range.
