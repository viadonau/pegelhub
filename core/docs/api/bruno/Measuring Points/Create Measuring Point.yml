info:
  name: Create Measuring Point
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/{{apiPath}}/measuring-points"
  headers:
    - name: X-Auth-Profile
      value: operator
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "stationId": "{{stationId}}",
        "name": "Main gauge",
        "position": {
          "riverKilometer": 1933.2,
          "bank": "left",
          "coordinates": { "latitude": 48.25, "longitude": 16.39 }
        },
        "gaugeZeroElevationMAboveAdria": 154.22,
        "waterLevelReferences": {
          "referenceSetYear": 2020,
          "rnwCm": 120.0,
          "mwCm": 280.0,
          "hswCm": 620.0,
          "hw100Cm": 760.0
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('status is 201', () => expect(res.getStatus()).to.equal(201));
        bru.setVar('measuringPointId', res.getBody().id);

docs: Creates a measuring point and captures its id.
