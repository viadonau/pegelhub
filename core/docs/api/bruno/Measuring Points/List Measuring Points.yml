info:
  name: List Measuring Points
  type: http
  seq: 2
  tags:
    - read-only

http:
  method: GET
  url: "{{baseUrl}}/{{apiPath}}/measuring-points"
  params:
    - name: stationId
      value: "{{stationId}}"
      type: query
      disabled: true
  headers:
    - name: X-Auth-Profile
      value: operator
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('status is 200', () => expect(res.getStatus()).to.equal(200));

docs: Lists measuring points. Enable stationId to filter by the selected station.
