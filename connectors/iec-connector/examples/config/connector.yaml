core:
  baseUrl: "http://localhost:8080/"
  authentication:
    tokenUrl: "http://localhost:8082/realms/pegelhub/protocol/openid-connect/token"
    clientId: "connector"
    clientSecret: "secret"
polling:
  interval: "30s"
# Optional: forward only the last received reading per IOA at each poll.
# ingestion:
#   mode: latest
mappings:
  directory: "mappings"
iec:
  server:
    host: "127.0.0.1"
    port: 2404
    commonAddress: 1
