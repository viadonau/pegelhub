core:
  baseUrl: "http://core.example.invalid:8080/"
  authentication:
    tokenUrl: "https://identity.example.invalid/realms/pegelhub/protocol/openid-connect/token"
    clientId: "replace-with-connector-client-id"
    clientSecret: "replace-with-connector-client-secret"
polling:
  interval: "15m"
mappings:
  directory: "mappings"
ftp:
  server:
    host: "ftp.example.invalid"
    port: 21
    authentication:
      username: "replace-with-ftp-username"
      password: "replace-with-ftp-password"
  source:
    directory: "/"
    parserType: "zrxp"
