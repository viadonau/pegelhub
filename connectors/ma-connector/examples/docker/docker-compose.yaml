services:
  ma-connector:
    image: ${MA_CONNECTOR_IMAGE:?Set MA_CONNECTOR_IMAGE to a GHCR ma connector image tag}
    restart: unless-stopped
    extra_hosts:
      - "pegelhub-keycloak.test:${PEGELHUB_HOST_IP:?Set PEGELHUB_HOST_IP to the Core/Keycloak host LAN IP}"
    devices:
      - "/dev/piControl0:/dev/piControl0"
    volumes:
      - ../config:/app/config:ro
      # For custom trust, uncomment this read-only mount and set PEGELHUB_TRUST_MODE=custom.
      # - ./extra-ca:/run/pegelhub/extra-ca:ro
    environment:
      JAVA_TOOL_OPTIONS: "-DLOG_LEVEL=INFO"
      PEGELHUB_TRUST_MODE: ${PEGELHUB_TRUST_MODE:-system}
