<ph-page>
  <ph-page-header title="Messreihen">
    <p ph-page-description class="ph-overview-result-summary" aria-live="polite">
      {{ resultSummary() }}
    </p>
  </ph-page-header>

  <ph-page-section ariaLabel="Messreihenübersicht" [loading]="loading()" [error]="error()">
    <ph-time-series-grid
      [rows]="rows()"
      [emptyMessage]="emptyMessage()"
      (visibleCountChange)="updateVisibleRowCount($event)"
    />
  </ph-page-section>
</ph-page>
