<ph-page>
  <ph-page-header title="Messreihen">
    <p ph-page-description class="ph-overview-result-summary" aria-live="polite">
      {{ overview.resultSummary() }}
    </p>
  </ph-page-header>

  <ph-page-section
    ariaLabel="Messreihenübersicht"
    [loading]="overview.isInitialLoading()"
    [error]="overview.errorMessage()"
  >
    @if (overview.supportingError(); as error) {
      <ph-message severity="warn" [text]="error" />
    }

    <ph-time-series-grid
      [rows]="overview.rows()"
      [emptyMessage]="overview.emptyMessage()"
      (visibleCountChange)="overview.updateVisibleRowCount($event)"
    />
  </ph-page-section>
</ph-page>
