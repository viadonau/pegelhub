<ph-page>
  <a class="ph-time-series-back-link" routerLink="/overview">
    <i class="pi pi-arrow-left" aria-hidden="true"></i>
    <span>Messreihen</span>
  </a>

  <ph-content-state [loading]="loading()" [error]="error()">
    <div class="ph-time-series-detail">
      @if (measuringPoint(); as point) {
        <header class="ph-time-series-heading">
          <div class="ph-time-series-heading-copy">
            <p class="ph-time-series-heading-kicker">Messreihe</p>
            <h1>{{ point.name }}</h1>
            @if (headingContext()) {
              <p class="ph-time-series-heading-context">{{ headingContext() }}</p>
            }
            @if (inactive()) {
              <p class="ph-time-series-status">Inaktiv</p>
            }
          </div>

          <div class="ph-time-series-current-reading">
            @if (latestReading(); as reading) {
              <ph-current-reading
                label="Letzter Messwert"
                [value]="reading.value"
                [unit]="reading.unit"
                [timestamp]="reading.timestamp"
                [relativeTimestamp]="reading.relativeTimestamp"
              />
            } @else {
              <p class="ph-time-series-current-status">Kein Messwert in den letzten 365 Tagen.</p>
            }
          </div>
        </header>

        <ph-time-series-metadata
          [measuringPointFacts]="pointFacts()"
          [timeSeriesFacts]="seriesFacts()"
        />
      }

      @if (historyAvailable()) {
        <ph-time-series-measurements
          [timeSeriesId]="timeSeriesId()"
          [observedProperty]="snapshot()?.observedProperty ?? ''"
          [unit]="displayUnit()"
          [referenceLines]="referenceLines()"
          (refresh)="reloadSnapshot()"
        />
      }
    </div>
  </ph-content-state>
</ph-page>
