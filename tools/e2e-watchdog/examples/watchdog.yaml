watchdogId: dhk-callisto
core:
  baseUrl: https://core.example.test/
  tokenUrl: https://identity.example.test/realms/pegelhub/protocol/openid-connect/token
  clientId: e2e-watchdog
  clientSecretFile: /run/secrets/core-client
timeSeriesId: 00000000-0000-0000-0000-000000000003
# Intentionally invalid: agree the full route's maximum age first, e.g. 600 for ten minutes.
silenceSeconds: 0
pollSeconds: 15
snmp:
  # Ports and OIDs must match the receiver configuration, not an assumed default.
  receivers:
    - host: receiver-a.example.test
      port: 162
    - host: receiver-b.example.test
      port: 162
  version: v3
  username: watchdog
  # Documentation enterprise OIDs only; replace with the receiver's agreed OIDs.
  trapOid: 1.3.6.1.4.1.32473.1
  messageOid: 1.3.6.1.4.1.32473.2
  authPasswordFile: /run/secrets/snmp-auth
  privacyPasswordFile: /run/secrets/snmp-privacy
