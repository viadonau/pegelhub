name: Staging Deploy
description: Update the checkout and deploy a single-host service or connector with staging configuration.

inputs:
  target:
    description: Deployment target (backend, frontend, or connector).
    required: true
  connector_instance_dir:
    description: Host directory for the connector instance when target is connector.
    required: false
    default: ''
  image:
    description: Image tag or immutable image reference passed to the deploy script.
    required: true
  deploy_ref:
    description: Repository branch or tag to deploy.
    required: true
  repo_dir:
    description: Repository path on the staging host.
    required: true
  host:
    description: Staging SSH host.
    required: true
  port:
    description: Staging SSH port.
    required: false
    default: '22'
  username:
    description: Staging SSH user.
    required: true
  key:
    description: Staging SSH private key.
    required: true
  fingerprint:
    description: Staging SSH host key fingerprint.
    required: true

runs:
  using: composite
  steps:
    - name: Run staging deploy
      uses: appleboy/ssh-action@v1
      env:
        DEPLOY_IMAGE: ${{ inputs.image }}
        DEPLOY_REF: ${{ inputs.deploy_ref }}
        DEPLOY_TARGET: ${{ inputs.target }}
        CONNECTOR_INSTANCE_DIR: ${{ inputs.connector_instance_dir }}
        STAGING_REPO_DIR: ${{ inputs.repo_dir }}
      with:
        host: ${{ inputs.host }}
        port: ${{ inputs.port }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        fingerprint: ${{ inputs.fingerprint }}
        command_timeout: 15m
        envs: STAGING_REPO_DIR,DEPLOY_REF,DEPLOY_TARGET,DEPLOY_IMAGE,CONNECTOR_INSTANCE_DIR
        script: |
          set -eu
          cd "$STAGING_REPO_DIR"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Staging repository has uncommitted tracked changes. Refusing to deploy." >&2
            exit 1
          fi

          git fetch --prune --tags origin
          if git show-ref --verify --quiet "refs/remotes/origin/$DEPLOY_REF"; then
            git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"
          else
            git checkout "$DEPLOY_REF"
          fi

          case "$DEPLOY_TARGET" in
            backend)
              PEGELHUB_CONFIG_DIR=/etc/pegelhub/staging \
              PEGELHUB_STATE_DIR=/var/lib/pegelhub/staging/state \
                deploy/single-host/scripts/deploy.sh "$DEPLOY_IMAGE"
              ;;
            frontend)
              PEGELHUB_CONFIG_DIR=/etc/pegelhub/staging \
              PEGELHUB_STATE_DIR=/var/lib/pegelhub/staging/state \
                deploy/single-host/scripts/deploy-frontend.sh "$DEPLOY_IMAGE"
              ;;
            connector)
              connector_dir=${CONNECTOR_INSTANCE_DIR:?Set connector_instance_dir for connector deployments}
              PEGELHUB_CONNECTOR_IMAGE="$DEPLOY_IMAGE" docker compose \
                --project-directory "$connector_dir" \
                --env-file "$connector_dir/connector.env" \
                -f deploy/connector/compose.yaml \
                up -d --pull always --wait --wait-timeout 30 connector
              ;;
            *)
              echo "Unknown deployment target: $DEPLOY_TARGET" >&2
              exit 1
              ;;
          esac
