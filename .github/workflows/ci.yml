name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    name: Maven Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven reactor
        run: mvn -B -ntp -Pintegration verify

      - name: Validate Compose files
        run: |
          docker compose --env-file core/.env.example -f core/docker-compose.yaml config --quiet
          docker compose --env-file deploy/staging/.env.example -f deploy/staging/compose.yaml config --quiet
