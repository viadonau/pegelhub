name: Frontend Delivery

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/actions/staging-deploy/action.yml'
      - '.github/workflows/frontend-delivery.yml'

permissions:
  contents: read

env:
  FRONTEND_IMAGE_REPOSITORY: ghcr.io/viadonau/pegelhub-frontend

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run checks
        run: npm run check
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      - name: Validate production image
        run: npm run image:validate -- "pegelhub-frontend:ci-${GITHUB_SHA}"
        working-directory: frontend

  publish:
    name: Publish Image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest_reference.outputs.reference }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE_REPOSITORY }}:sha-${{ github.sha }}

      - name: Resolve immutable digest reference
        id: digest_reference
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "reference=${FRONTEND_IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

  request-staging-deployment:
    name: Deploy Staging Frontend
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy frontend
        uses: ./.github/actions/staging-deploy
        with:
          target: frontend
          image: ${{ needs.publish.outputs.image }}
          deploy_ref: main
          repo_dir: ${{ vars.STAGING_REPO_DIR }}
          host: ${{ vars.STAGING_SSH_HOST }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
