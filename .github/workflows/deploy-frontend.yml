name: Deploy Frontend
run-name: Deploy frontend ${{ github.event.client_payload.source_sha || inputs.image }}

on:
  repository_dispatch:
    types:
      - frontend-staging
  workflow_dispatch:
    inputs:
      image:
        description: Immutable frontend image reference.
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy frontend
        uses: ./.github/actions/staging-deploy
        with:
          target: frontend
          image: ${{ github.event.client_payload.image || inputs.image }}
          deploy_ref: main
          repo_dir: ${{ vars.STAGING_REPO_DIR }}
          host: ${{ vars.STAGING_SSH_HOST }}
          port: ${{ vars.STAGING_SSH_PORT || '22' }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
