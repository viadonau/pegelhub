name: Watchdog Image

on:
  pull_request:
    paths: ['tools/e2e-watchdog/**', 'connectors/library/**', '.github/workflows/watchdog.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only the watchdog image. Never deploys it.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -ntp -pl tools/e2e-watchdog -am verify
      - run: docker compose -f tools/e2e-watchdog/lab/compose.yaml config --quiet
      - run: docker build -f tools/e2e-watchdog/Dockerfile -t ph-watchdog:test .
      - run: sh tools/e2e-watchdog/tests/image-check.sh ph-watchdog:test
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with: {cache-image: false}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/docker-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/pegelhub-e2e-watchdog
          context: .
          file: tools/e2e-watchdog/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
